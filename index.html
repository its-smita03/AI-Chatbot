<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI Chatbot</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 15px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.app {
    width: 100%;
    max-width: 750px;
    height: 85vh;
    min-height: 450px;
    display: flex;
    flex-direction: column;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    overflow: hidden;
}

header {
    padding: 18px;
    background: #172033;
    border-bottom: 1px solid #334155;
}

header h2 { margin: 0 0 8px; color: #a5b4fc; }
header p { margin: 0; font-size: 13px; }

#chatbox {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px;
}

.welcome {
    text-align: center;
    margin-top: 40px;
    line-height: 1.8;
    color: #cbd5e1;
}

.message {
    display: block;
    width: fit-content;
    max-width: 85%;
    padding: 12px;
    margin: 12px 0;
    border-radius: 12px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    line-height: 1.5;
}

.user {
    margin-left: auto;
    background: #4f46e5;
}

.bot { background: #334155; }

form {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: #172033;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    color: white;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 10px;
    font-size: 15px;
}

button {
    padding: 12px 15px;
    border: 0;
    border-radius: 10px;
    color: white;
    background: #6366f1;
    font-weight: bold;
    cursor: pointer;
}

#clear {
    margin: 0 12px 12px;
    background: #334155;
}

footer {
    padding: 0 8px 12px;
    text-align: center;
    color: #94a3b8;
    font-size: 11px;
}

@media(max-width: 500px) {
    .app { height: 90vh; }
    header { padding: 14px; }
    form { padding: 9px; gap: 6px; }
    button { padding: 10px; }
}
</style>
</head>

<body>
<div class="app">

<header>
    <h2>✨ Nova AI</h2>
    <p>Your personal AI assistant · Chat Demo</p>
</header>

<main id="chatbox">
    <div class="welcome" id="welcome">
        <h2>👋 Hello there!</h2>
        <p>Welcome to Nova AI.<br>
        Type a message below to start chatting.</p>
    </div>
</main>

<form id="chatForm">
    <input id="message" type="text"
        placeholder="Type your message..."
        maxlength="2000" autocomplete="off" required>
    <button id="send" type="submit">Send ➤</button>
</form>

<button id="clear" type="button">🗑 Clear Chat</button>

<footer>Demo chatbot · Real AI API not connected yet</footer>

</div>

<script>
(function () {
    const chatbox = document.getElementById("chatbox");
    const input = document.getElementById("message");
    const form = document.getElementById("chatForm");
    const send = document.getElementById("send");
    const clear = document.getElementById("clear");

    function addMessage(sender, text, type) {
        const welcome = document.getElementById("welcome");
        if (welcome) welcome.remove();

        const item = document.createElement("div");
        item.className = "message " + type;
        item.textContent = sender + ": " + text;

        chatbox.appendChild(item);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const text = input.value.trim();
        if (!text) return;

        addMessage("You", text, "user");
        input.value = "";
        input.focus();

        send.disabled = true;
        send.textContent = "Wait...";

        setTimeout(function () {
            let reply;

            if (/hello|hi|hey/i.test(text)) {
                reply = "Hello! Welcome to Nova AI. How can I help you?";
            } else if (/your name|who are you/i.test(text)) {
                reply = "I am Nova AI, your chatbot demo assistant.";
            } else if (/python/i.test(text)) {
                reply = "Python is a programming language known for its simple syntax.";
            } else if (/java/i.test(text)) {
                reply = "Java is an object-oriented programming language.";
            } else if (/ai|artificial intelligence/i.test(text)) {
                reply = "AI means Artificial Intelligence. It enables computers to perform tasks that usually require human intelligence.";
            } else if (/thank/i.test(text)) {
                reply = "You're welcome!";
            } else {
                reply = "I received your message: \"" + text +
                    "\". This is a demo reply, not a real AI-generated answer.";
            }

            addMessage("Nova AI", reply, "bot");
            send.disabled = false;
            send.textContent = "Send ➤";
        }, 300);
    });

    clear.addEventListener("click", function () {
        chatbox.innerHTML = "";

        const welcome = document.createElement("div");
        welcome.className = "welcome";
        welcome.id = "welcome";
        welcome.innerHTML =
            "<h2>👋 Hello there!</h2>" +
            "<p>Welcome to Nova AI.<br>" +
            "Type a message below to start chatting.</p>";

        chatbox.appendChild(welcome);
        input.value = "";
        input.focus();
    });
})();
</script>
</body>
</html>
