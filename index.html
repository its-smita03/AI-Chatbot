<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.app {
    width: 100%;
    max-width: 750px;
    height: 85vh;
    min-height: 450px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 15px 50px #0005;
}

header {
    padding: 20px;
    background: #172033;
    border-bottom: 1px solid #334155;
}

header h2 {
    margin: 0 0 7px;
    color: #a5b4fc;
}

header p {
    margin: 0;
    color: #cbd5e1;
    font-size: 13px;
}

#chatbox {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 12px 0;
    border-radius: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user {
    background: #4f46e5;
    margin-left: auto;
}

.bot {
    background: #334155;
    margin-right: auto;
}

.welcome {
    text-align: center;
    color: #cbd5e1;
    margin-top: 45px;
    line-height: 1.8;
}

form {
    display: flex;
    gap: 10px;
    padding: 15px;
    background: #172033;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #475569;
    outline: none;
    background: #0f172a;
    color: white;
    font-size: 15px;
}

button {
    padding: 12px 17px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4f46e5;
}

#clear {
    margin: 0 15px 15px;
    background: #334155;
}

#clear:hover {
    background: #475569;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

footer {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    padding: 0 10px 12px;
}

@media (max-width: 500px) {
    .app {
        height: 90vh;
    }

    header {
        padding: 15px;
    }

    #chatbox {
        padding: 12px;
    }

    form {
        padding: 10px;
    }

    button {
        padding: 10px;
    }
}
</style>
</head>

<body>
<div class="app">

    <header>
        <h2>✨ Nova AI</h2>
        <p>Your personal AI assistant · Chat Demo</p>
    </header>

    <main id="chatbox">
        <div class="welcome" id="welcome">
            <h2>👋 Hello there!</h2>
            <p>Welcome to Nova AI.<br>
            Type a message below to start chatting.</p>
        </div>
    </main>

    <form id="chatForm">
        <input
            id="message"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
            maxlength="2000"
            required
        >
        <button id="send" type="submit">Send ➤</button>
    </form>

    <button id="clear" type="button">🗑 Clear Chat</button>

    <footer>
        Demo version · AI API connection not configured
    </footer>
</div>

<script>
const chatbox = document.getElementById("chatbox");
const input = document.getElementById("message");
const form = document.getElementById("chatForm");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");

function addMessage(sender, text, type) {
    if (welcome) welcome.remove();

    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = sender + ": " + text;

    chatbox.appendChild(message);
    chatbox.scrollTop = chatbox.scrollHeight;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    addMessage("You", text, "user");
    input.value = "";

    sendButton.disabled = true;
    sendButton.textContent = "Wait...";

    setTimeout(function() {
        addMessage(
            "Nova AI",
            "This is currently a demo chatbot. Connect a real AI API through a secure backend to receive intelligent answers.",
            "bot"
        );

        sendButton.disabled = false;
        sendButton.textContent = "Send ➤";
        input.focus();
    }, 500);
});

document.getElementById("clear").addEventListener("click", function() {
    chatbox.innerHTML = 
        <div class="welcome" id="welcome">
            <h2>👋 Hello there!</h2>
            <p>Welcome to Nova AI.<br>
            Type a message below to start chatting.</p>
        </div>
    ;
});

</script>
</body>
</html>
